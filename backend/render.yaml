# Render Blueprint for the Django backend.
# Use with the Preview Environment / Blueprint flow, or as a reference.
services:
  - type: web
    name: tasktracker-backend
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /api/account/settings/
    buildCommand: |
      cd backend && python3 -m venv .venv && \
      ./.venv/bin/pip install --upgrade pip && \
      ./.venv/bin/pip install -r requirements.txt && \
      ./.venv/bin/python manage.py migrate --noinput && \
      ./.venv/bin/python manage.py collectstatic --noinput && \
      ./.venv/bin/python manage.py check
    startCommand: |
      ./.venv/bin/gunicorn Tracker.wsgi:application \
        --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DEBUG
        value: "False"
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
        sync: false
      - key: DB_SSLMODE
        value: "require"
        sync: false
      - key: DB_CHANNEL_BINDING
        value: "require"
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
